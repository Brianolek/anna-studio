name: Build calendar and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'   # daily, keeps the 8-week calendar horizon rolling forward
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild calendar.ics
        run: node tools/build_calendar.mjs
      - name: Commit calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rebuild calendar.ics [skip ci]"
            git push
          fi
      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
